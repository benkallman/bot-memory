name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Example tree passes the onboarding check
        run: |
          find examples/demo-memory -type f -exec chmod 600 {} +
          python tools/onboard_check.py examples/demo-memory
      - name: Repo has no secret-looking text
        run: python tools/memwrite.py scan README.md docs/*.md templates/*.md templates/master/*.md
